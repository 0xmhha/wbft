# Owners of the public Part A requirements of the wbft specification.
#
# Each entry maps a requirement ID to the wbft package that implements it
# (owner) and the functions, types or mechanisms that do so (symbols). class
# marks requirements whose subject is not wbft itself:
#   external   - the application or an adapter outside wbft implements it
#   deployment - network operation, not decidable by a node
#   spec       - rules for vector files, runners or generators
#   withdrawn  - withdrawn requirement (informative)
# Entries without class are owned by wbft. tools/tracegen joins this table with
# the specification, the vectors and the "// Spec:" comments in the code.
# For the chapters that CI checks (tracegen -check, see README.md), every
# symbol of a wbft-owned entry must be declared in the code: "pkg.Name",
# "pkg.Type.Method" or an unqualified name in an owner package.

