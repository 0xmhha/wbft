# Build, test and lint of the wbft module and its developer tools.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # wbft is built with cgo only (blst, secp256k1).
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local

jobs:
  test:
    name: build and test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires Go 1.26.8 (the release line with security fixes
        # that the toolchain survey D-111 covered).
        go: ["1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - run: go build ./...
      - run: go vet ./...
      # -short keeps the simulation tests to a few seeds under the race
      # detector; the simulation job runs more.
      - run: go test -race -short ./...

  simulation:
    # The deterministic simulator: the scenario bundle with reference
    # behaviour and the restart-safety rules, replay determinism, disk
    # faults, floods, and crashes at every fault point (tag wbft_faults).
    # The full run uses WBFT_SIM_SEEDS=10000 and is run locally.
    name: simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: scenario bundle (50 seeds per scenario)
        shell: bash # -eo pipefail: the test result survives the filter
        run: WBFT_SIM_SEEDS=50 go test -count=1 -timeout 30m -run TestBundle -v ./conformance/sim/ | grep -v '^=== '
      - name: other simulation tests and replay determinism
        run: go test -count=1 -timeout 30m -skip TestBundle ./conformance/...
      - name: crashes at every fault point
        run: go test -count=1 -timeout 30m -tags wbft_faults -run TestCrashAtFaultPoints -v ./conformance/sim/

  node:
    # The node, the transports and the kvstore example: network tests that
    # -short skips, the node-level sign floor crashes (tag wbft_faults), and
    # a local network of separate processes.
    name: node and example network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - run: go test -count=1 -race ./node/ ./mempool/ ./p2p/... ./rpc/ ./examples/...
      - run: go test -count=1 -tags wbft_faults ./node/
      - name: kvstore devnet (4 processes)
        run: scripts/kvstore-devnet.sh 4

  tools:
    name: developer tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: tools/go.sum
      - working-directory: tools
        run: |
          go build ./...
          go vet ./...
          go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - name: golangci-lint (wbft module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: golangci-lint (tools module)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: tools
      - name: coredet (determinism of the core and pure modules)
        run: |
          go -C tools build -o ../bin/coredet ./lint/coredet/cmd/coredet
          bin/coredet ./...
      - name: heightlow (truncation of heights and rounds)
        run: |
          go -C tools build -o ../bin/heightlow ./lint/heightlow/cmd/heightlow
          bin/heightlow -require "$(cat scripts/heightlow-rows.txt | tr -d ' ' | paste -sd, -)" ./...
      - name: dependency allow-list
        run: scripts/check-deps.sh

  lint-negative:
    # Proves that the boundary rules reject violating branches: header
    # importing consensus, forbidden go-ethereum packages, modules outside
    # the allow-list, and the determinism rules.
    name: lint rejects violations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          install-only: true
      - run: scripts/lint-negative.sh

  adapter:
    name: vector adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go build -o bin/wbft-vector-adapter ./cmd/wbft-vector-adapter
      - name: protocol smoke test
        run: |
          out=$(printf '%s\n' \
            '{"type":"hello","protocol":"wbft-vector/1","runner":{"name":"ci","version":"0"},"spec_commit":"none"}' \
            '{"type":"case","id":1,"runner":"crypto","handler":"keccak256","case":"smoke","kind":"pure","input":{"data":"0x"}}' \
            '{"type":"case","id":2,"runner":"chain","handler":"genesis","case":"smoke","kind":"pure","input":{}}' \
            '{"type":"bye"}' | bin/wbft-vector-adapter)
          echo "$out"
          echo "$out" | sed -n 1p | grep -q '"protocol":"wbft-vector/1"'
          echo "$out" | sed -n 2p | grep -q '"hash":"0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470"'
          echo "$out" | sed -n 3p | grep -q '"status":"unsupported"'
      # Placeholder: run the conformance vectors once the public
      # specification repository publishes them. Set the repository variable
      # WBFT_SPEC_REPOSITORY (owner/name) to enable. The runner is expected at
      # spec/tools/vectorgen/check_adapter.py and the vectors at spec/vectors/.
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        id: specref
        # The specification revision is pinned in the repository so that a
        # change in wbft-spec reaches wbft only through a reviewed update.
        run: echo "ref=$(cat internal/trace/wbft-spec.ref)" >> "$GITHUB_OUTPUT"
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WBFT_SPEC_REPOSITORY }}
          ref: ${{ steps.specref.outputs.ref }}
          path: wbft-spec
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        name: conformance vectors
        run: |
          pip install pyyaml
          # check_adapter.py exits 1 while any case is unsupported (the
          # execution handlers and the transport-framing network cases belong
          # to other adapters), so the gate is on failed cases only.
          python3 wbft-spec/spec/tools/vectorgen/check_adapter.py wbft-spec/spec/vectors -- bin/wbft-vector-adapter | tee vectors.txt || true
          grep -q '^pass=[0-9]* fail=0 ' vectors.txt
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        name: steps vectors through the step driver (with the transport frame stage)
        run: WBFT_SPEC_VECTORS="$PWD/wbft-spec/spec/vectors" go test -count=1 ./conformance/stepdriver/
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        name: traceability matrix
        # Fails when the requirement list or the vector-handler column of the
        # matrix drifts from the committed baseline (internal/trace/baseline.tsv).
        run: |
          go -C tools build -o ../bin/tracegen ./tracegen
          bin/tracegen -spec wbft-spec/spec -vectors wbft-spec/spec/vectors \
            -owners internal/trace/owners.yaml -code . -prefix WBFT- -format md -o traceability.md \
            -baseline internal/trace/baseline.tsv
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        name: traceability check (A-01, A-02, A-03, A-04, A-08)
        # Every wbft-owned requirement of these chapters has declared
        # symbols, a // Spec: comment in an owner package and evidence: a
        # vector handler of the adapter (whose cases passed above) or a test
        # marked // Covers:.
        run: |
          bin/tracegen -spec wbft-spec/spec -vectors wbft-spec/spec/vectors \
            -owners internal/trace/owners.yaml -code . -prefix WBFT- -o /dev/null \
            -check A-01,A-02,A-03,A-04,A-08 -adapter bin/wbft-vector-adapter
      - if: ${{ always() && vars.WBFT_SPEC_REPOSITORY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: traceability
          path: traceability.md

  determinism-cross-arch:
    # The binary64 quorum and round-timeout tables and the reference sort
    # fixtures must give the same results on amd64 and arm64. Each runner
    # also runs the validators/quorum and timers/round_timeout vectors of the
    # pinned wbft-spec revision and writes their per-case results, and writes
    # the message journals of the simulation scenarios; the next jobs compare
    # the vector results and replay the journals on the other architecture.
    name: determinism (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - run: go test -count=1 ./chain/validator/ ./consensus/ ./internal/refsort/ ./types/ ./chain/epoch/
      - name: replay determinism on this architecture
        run: go test -count=1 -run TestReplayDeterminism ./conformance/stepdriver/
      - name: write journals
        run: WBFT_REPLAY_SEEDS=1 WBFT_JOURNAL_OUT="$PWD/journals" go test -count=1 -run TestJournalExport ./conformance/stepdriver/
      - uses: actions/upload-artifact@v4
        with:
          name: journals-${{ matrix.arch }}
          path: journals
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        id: specref
        run: echo "ref=$(cat internal/trace/wbft-spec.ref)" >> "$GITHUB_OUTPUT"
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WBFT_SPEC_REPOSITORY }}
          ref: ${{ steps.specref.outputs.ref }}
          path: wbft-spec
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        name: quorum and round-timeout vectors on this architecture
        # Fails when a case fails or is unsupported.
        run: |
          pip install pyyaml
          go build -o bin/wbft-vector-adapter ./cmd/wbft-vector-adapter
          scripts/cross-arch-vectors.sh wbft-spec/spec bin/wbft-vector-adapter vectors-${{ matrix.arch }}.txt
      - if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vectors-${{ matrix.arch }}
          path: vectors-${{ matrix.arch }}.txt

  vectors-cross-arch:
    # The per-case results of the quorum and round-timeout vectors are the
    # same on amd64 and arm64.
    name: vector results equal on amd64 and arm64
    if: ${{ vars.WBFT_SPEC_REPOSITORY != '' }}
    needs: determinism-cross-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vectors-*
          merge-multiple: true
      - run: |
          wc -l vectors-amd64.txt vectors-arm64.txt
          diff vectors-amd64.txt vectors-arm64.txt

  journal-replay-cross-arch:
    # A journal written on one architecture replays with every step
    # matching on the other.
    name: replay ${{ matrix.from }} journals on ${{ matrix.arch }}
    needs: determinism-cross-arch
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            from: arm64
          - runner: ubuntu-24.04-arm
            arch: arm64
            from: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - uses: actions/download-artifact@v4
        with:
          name: journals-${{ matrix.from }}
          path: journals
      - run: WBFT_JOURNAL_IN="$PWD/journals" go test -count=1 -run TestJournalImport -v ./conformance/stepdriver/
